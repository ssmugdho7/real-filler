<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Real Filler Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Real Filler <span>PRO</span></h1>
      <div class="profile-selector">
        <select id="current-profile">
          <option value="default">Default Profile</option>
        </select>
        <button id="add-profile" title="Add Profile">+</button>
      </div>
    </header>

    <div class="tabs">
      <button class="tab-btn" data-tab="data">Learned Data</button>
      <button class="tab-btn" data-tab="candidates">Candidates</button>
      <button class="tab-btn active" data-tab="templates">References</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>

    <div id="data-tab" class="tab-content">
      <div id="data-list" class="data-list">
        <!-- Items injected here -->
      </div>
    </div>

    <div id="candidates-tab" class="tab-content">
      <div class="candidate-selector">
        <label>Select Candidate</label>
        <select id="candidate-select" class="text-input">
          <option value="">-- Choose --</option>
        </select>
        <button id="edit-candidate-btn" class="primary-btn small" style="width:auto; margin-left:8px;">Edit</button>
        <button id="save-candidate-btn" class="primary-btn small" style="width:auto; margin-left:8px; display:none;">Save</button>
        <button id="cancel-candidate-btn" class="danger-outline small" style="width:auto; margin-left:8px; display:none;">Cancel</button>
      </div>
      <div id="candidate-details" class="candidate-details"></div>
    </div>

    <div id="templates-tab" class="tab-content active">
      <p class="tab-desc">
        Reference contacts shared across all candidates.
      </p>
      <div id="template-lines" class="template-lines"></div>
    </div>

    <div id="settings-tab" class="tab-content">
      <div class="setting-item">
        <label>Auto-fill on load</label>
        <input type="checkbox" id="auto-fill-toggle">
      </div>

      <div class="setting-item setting-group">
        <label>Sentence autocomplete <span class="hint">(off by default)</span></label>
        <input type="checkbox" id="sentence-autocomplete-toggle">
      </div>

      <div id="llm-settings" class="setting-subgroup" hidden>
        <div class="setting-item">
          <label>Use LLM for suggestions</label>
          <input type="checkbox" id="llm-enabled-toggle">
        </div>
        <div class="setting-item column">
          <label>Provider</label>
          <select id="llm-provider" class="text-input">
            <option value="openai">OpenAI-compatible</option>
            <option value="gemini">Google Gemini</option>
          </select>
        </div>
        <div class="setting-item column" id="llm-endpoint-item">
          <label>LLM Endpoint URL</label>
          <input type="text" id="llm-endpoint" class="text-input" placeholder="https://api.openai.com/v1/chat/completions">
        </div>
        <div class="setting-item column">
          <label>Model</label>
          <input type="text" id="llm-model" class="text-input" placeholder="gpt-4o-mini">
        </div>
        <div class="setting-item column">
          <label>API Key</label>
          <input type="password" id="llm-api-key" class="text-input" placeholder="sk-... or Gemini key">
        </div>
        <div class="setting-note">
          Warning: enabling the LLM sends the text you type (and your learned
          writing samples) to a third-party endpoint. This breaks the offline,
          privacy-first model for those suggestions.
        </div>
      </div>

      <div class="setting-item">
        <button id="clear-profile" class="danger-outline">Clear Current Profile</button>
      </div>
      <div class="setting-item">
        <button id="clear-all" class="danger">Delete All Profiles</button>
      </div>
    </div>

    <footer id="main-footer">
      <button id="manual-fill-btn" class="primary-btn">Fill Current Page</button>
    </footer>
  </div>
  <script src="candidates.js"></script>
  <script src="popup.js"></script>
</body>
</html>
